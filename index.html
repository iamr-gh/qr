<html lang="en">
    <meta charset="UTF-8">
    <head>
        <title>QR Code</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body style="background-color: #1e1e1e; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; font-family: 'Segoe UI', Arial, sans-serif;">
        <div class="content" style="background-color: #1e1e1e; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; font-family: 'Segoe UI', Arial, sans-serif;">
            <script src="encoder.js"></script>

        <h1 style="font-size: 2.5rem; margin-bottom: 20px; text-align: center; word-wrap: break-word; max-width: 100%; width: 100%; display: flex; justify-content: center;">QR Code Generator</h1>
        <input type="text" 
               id="input" 
               placeholder="Name of link" 
               oninput="makeQRCode(this.value)"
               style="margin: 10px 0; padding: 12px 16px; width: 300px; max-width: 90%; font-size: 1rem; border: 2px solid #444; border-radius: 6px; background: #2d2d2d; color: white; outline: none;">
        <div id="qrCodeContainer" style="margin: 10px 0;"></div>
        <div id="errorMessage" style="color: red; margin-bottom: 10px; display: none; text-align: center; padding: 0 20px;">QR code generator does not support more than 32 chars currently</div>
        <div style="background-color: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.3); max-width: 100%; box-sizing: border-box;">
            <svg id="qrCodeSvg" width="250" height="250" style="max-width: 100%; height: auto;"></svg>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; justify-content: center;">
            <button onclick="downloadPNG()" style="padding: 8px 16px; background: #444; color: white; border: none; border-radius: 4px; cursor: pointer;">Download PNG</button>
            <button onclick="downloadSVG()" style="padding: 8px 16px; background: #444; color: white; border: none; border-radius: 4px; cursor: pointer;">Download SVG</button>
        </div>
        <script>
            let prevQrCode = null;

            function makeQRCode(str) {
                const errorMessage = document.getElementById("errorMessage");
                
                // Max 32 chars for byte mode (V2)
                if (str.length > 32) {
                    errorMessage.style.display = "block";
                    return;
                }
                
                errorMessage.style.display = "none";
                
                var qrCode = make_qr_code__encoder_u1283(str);

                // Convert qrCode into boolean array
                var boolQrCode = [];
                for (var i = 0; i < qrCode.length; i++) {
                    boolQrCode[i] = [];
                    for (var j = 0; j < qrCode[i].length; j++) {
                        boolQrCode[i][j] = Boolean(qrCode[i][j]);
                    }
                }

                // Determine QR code size (V1: 21x21, V2: 25x25)
                var moduleSize = boolQrCode.length;
                var svgSize = moduleSize * 10;
                
                console.log("QR code version:", moduleSize === 21 ? "V1" : "V2", "Size:", moduleSize + "x" + moduleSize);

                // create a svg element
                var svg = document.getElementById("qrCodeSvg");
                if (!svg) {
                    console.error("SVG element not found!");
                    return;
                }
                svg.innerHTML = "";
                svg.setAttribute("width", svgSize);
                svg.setAttribute("height", svgSize);

                // write array values as black and white squares
                for (var i = 0; i < boolQrCode.length; i++) {
                    for (var j = 0; j < boolQrCode[i].length; j++) {
                        var square = document.createElementNS(svg.namespaceURI, "rect");
                        square.setAttribute("width", "10");
                        square.setAttribute("height", "10");
                        square.setAttribute("fill", boolQrCode[i][j] ? "black" : "white");
                        square.setAttribute("x", j * 10);
                        square.setAttribute("y", i * 10);
                        svg.appendChild(square);
                    }
                }
                
                console.log("QR code generated with", boolQrCode.length, "rows and", boolQrCode[0].length, "columns");
                
                prevQrCode = boolQrCode;
            }

            function downloadSVG() {
                const svg = document.getElementById("qrCodeSvg");
                const input = document.getElementById("input");
                const filename = input.value.replace(/\./g, '-');
                svg.style.backgroundColor = "white"; // Temporarily set background to white
                const serializer = new XMLSerializer();
                const svgStr = serializer.serializeToString(svg);
                svg.style.backgroundColor = ""; // Reset background
                const blob = new Blob([svgStr], {type: 'image/svg+xml'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${filename}.svg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

                function downloadPNG() {
                    const svg = document.getElementById("qrCodeSvg");
                    const input = document.getElementById("input");
                    const filename = input.value.replace(/\./g, '-');
                    svg.style.backgroundColor = "white"; // Temporarily set background to white
                    const canvas = document.createElement("canvas");
                    const ctx = canvas.getContext("2d");
                    const data = (new XMLSerializer()).serializeToString(svg);
                    const DOMURL = window.URL || window.webkitURL || window;
                    
                    const img = new Image();
                    const svgBlob = new Blob([data], {type: 'image/svg+xml;charset=utf-8'});
                    const url = DOMURL.createObjectURL(svgBlob);
                    
                    img.onload = function() {
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.fillStyle = "white";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0);
                        DOMURL.revokeObjectURL(url);
                        svg.style.backgroundColor = ""; // Reset background
                        
                        const imgURI = canvas
                            .toDataURL('image/png')
                            .replace('image/png', 'image/octet-stream');
                        
                        const a = document.createElement('a');
                        a.href = imgURI;
                        a.download = `${filename}.png`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    };
                    
                    img.src = url;
                }
            </script>
